    <script>
        // Project Card Rotation Logic
        const cards = document.querySelectorAll('.project-card');
        const btnLeft = document.querySelector('.nav-left');
        const btnRight = document.querySelector('.nav-right');
        let positions = ['card-3', 'card-2', 'card-1']; 

        function updateCards() {
            cards.forEach((card, index) => {
                card.classList.remove('card-1', 'card-2', 'card-3');
                card.classList.add(positions[index]);
            });
        }

        btnRight.addEventListener('click', () => {
            positions.push(positions.shift());
            updateCards();
        });

        btnLeft.addEventListener('click', () => {
            positions.unshift(positions.pop());
            updateCards();
        });

        // Real-time Clock Logic
        function updateClock() {
            const clockElement = document.getElementById('real-time-clock');
            if (clockElement) {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                clockElement.textContent = `${hours}.${minutes}`;
            }
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
