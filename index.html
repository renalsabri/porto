<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Portfolio</title>
    
    <!-- Consolidated Stylesheets -->
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="About/about.css">
    <link rel="stylesheet" href="Project/project.css">
    
    <style>
        /* Smooth scrolling behavior and section constraint rules */
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #1a1a1a;
        }
        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- 1. Home Section -->
    <section id="home" class="canvas">
        <header class="top-bar">
            <div class="nav-pill left-pill" id="real-time-clock">13.00</div>
            <div class="nav-pill right-pill">
                <img class="nav-icon" src="https://www.figma.com/api/mcp/asset/304946cf-f0cd-47aa-8e61-20d28380114b" alt="">

        <main class="hero">

            </div>

            <div class="hero-copy">

            <!-- Anchor link directed to the About section -->
            <a class="profile-button" href="../About/about.html">Profile</a>

        <div class="waves-container">
            <div class="wave-svg-layer">
                <svg viewBox="0 0 1920 1000" preserveAspectRatio="none" aria-hidden="true">

                    <path class="wave-band wave-band-2" d="M0 680 C330 620 650 620 960 690 C1270 760 1600 760 1920 690 L1920 1000 L0 1000 Z" fill="#1C263B"></path>
                    <path class="wave-band wave-band-3" d="M0 760 C340 700 620 700 960 760 C1260 820 1560 820 1920 760 L1920 1000 L0 1000 Z" fill="#182031"></path>
                </svg>
            </div>
        </div>
    <script src="wave-animation.js"></script>

</html>
